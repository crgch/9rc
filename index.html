<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九龍 입주 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b0a; --panel:#101413; --panel2:#161d1b;
    --ink:#d6e7df; --muted:#6f877d; --line:#26322d;
    --neon:#16efc6; --shrine:#ff2b46; --amber:#ffb025; --copper:#b3854c;
    --glow:0 0 18px rgba(22,239,198,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55}
  body{padding:28px 16px 80px;position:relative;overflow-x:hidden}
  /* 브라운관 스캔라인 */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5}
  .wrap{max-width:680px;margin:0 auto}
  .han{font-family:'Black Han Sans',sans-serif}

  /* 헤더 */
  header{border:1px solid var(--line);background:
    radial-gradient(120% 140% at 0% 0%,rgba(255,43,70,.08),transparent 55%),var(--panel);
    padding:20px 20px 18px;position:relative;overflow:hidden}
  header::before{content:"異 能 登 録";position:absolute;right:-6px;top:-14px;
    font-family:'Black Han Sans';font-size:62px;color:rgba(22,239,198,.05);
    letter-spacing:8px;white-space:nowrap}
  .kick{font-family:'Noto Sans Mono';font-size:11px;letter-spacing:3px;
    color:var(--neon);text-transform:uppercase}
  h1{font-family:'Black Han Sans';font-size:clamp(30px,8vw,46px);margin:6px 0 4px;
    color:var(--ink);text-shadow:var(--glow);position:relative}
  h1 .red{color:var(--shrine);text-shadow:0 0 16px rgba(255,43,70,.45)}
  .sub{color:var(--muted);font-size:13px;max-width:46ch}
  .sub b{color:var(--amber);font-weight:700}

  /* 스텝 카드 */
  section{border:1px solid var(--line);background:var(--panel);margin-top:14px;
    padding:18px 18px 20px;position:relative}
  .step{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .num{font-family:'Black Han Sans';font-size:13px;color:var(--bg);
    background:var(--neon);padding:1px 8px;letter-spacing:1px;box-shadow:var(--glow)}
  .step h2{font-size:15px;margin:0;letter-spacing:.5px}
  .step .ko{color:var(--muted);font-size:12px;font-weight:400}
  section.locked{opacity:.4;filter:saturate(.4)}
  section.locked::after{content:"先 단계 완료";position:absolute;inset:0;
    display:grid;place-items:center;font-family:'Noto Sans Mono';font-size:12px;
    color:var(--muted);letter-spacing:2px;background:rgba(8,11,10,.55)}

  /* 출신 카드 */
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.picks{grid-template-columns:1fr}}
  .pick{border:1px solid var(--line);background:var(--panel2);padding:14px;
    cursor:pointer;transition:.15s;position:relative}
  .pick:hover{border-color:var(--neon);transform:translateY(-2px)}
  .pick.on{border-color:var(--neon);box-shadow:var(--glow);background:#13201d}
  .pick .tag{font-family:'Noto Sans Mono';font-size:10px;color:var(--copper);letter-spacing:2px}
  .pick .t{font-family:'Black Han Sans';font-size:18px;margin:4px 0 6px}
  .pick .d{font-size:12px;color:var(--muted);line-height:1.45}
  .pick.on .t{color:var(--neon)}

  label.fld{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.5px}
  input[type=text],textarea{width:100%;background:#0b0f0e;color:var(--ink);
    border:1px solid var(--line);padding:11px 12px;font-family:inherit;font-size:14px;
    border-radius:0;outline:none}
  input:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon)}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  button{font-family:'Noto Sans KR';font-weight:700;cursor:pointer;border:none;
    padding:11px 16px;font-size:13px;letter-spacing:.5px;border-radius:0;transition:.15s}
  .btn{background:var(--neon);color:#04110d;box-shadow:var(--glow)}
  .btn:hover{filter:brightness(1.12)}
  .btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .ghost:hover{border-color:var(--neon);color:var(--neon)}

  /* 보정 결과 */
  .out{margin-top:14px;border:1px solid var(--line);background:#0b100e;padding:0}
  .out .bar{display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;border-bottom:1px solid var(--line);
    font-family:'Noto Sans Mono';font-size:11px;letter-spacing:2px;color:var(--neon)}
  .out .body{padding:14px}
  .pname{font-family:'Black Han Sans';font-size:22px;color:var(--neon);text-shadow:var(--glow)}
  .pdesc{font-size:14px;margin:6px 0 14px;color:var(--ink)}
  .penalty{border-left:3px solid var(--amber);background:rgba(255,176,37,.06);
    padding:9px 12px}
  .penalty .lab{font-family:'Black Han Sans';color:var(--amber);font-size:13px;letter-spacing:2px}
  .penalty .txt{font-size:13px;color:#ffd98a;margin-top:3px}
  .loading{padding:18px;text-align:center;color:var(--muted);font-family:'Noto Sans Mono';font-size:12px}
  .loading .blip{color:var(--neon);animation:blip 1s steps(4) infinite}
  @keyframes blip{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  .err{color:var(--shrine);font-size:12px;padding:10px 12px;border-left:3px solid var(--shrine);
    background:rgba(255,43,70,.06);margin-top:10px}

  .facs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:520px){.facs{grid-template-columns:1fr}}
  .fac{border:1px solid var(--line);background:var(--panel2);padding:11px 12px;cursor:pointer;transition:.15s;min-height:104px}
  .fac:hover{border-color:var(--neon)}
  .fac.on{border-color:var(--neon);box-shadow:var(--glow);background:#13201d}
  .fac .badgeRow{min-height:18px;display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
  .fac .badge{font-family:'Noto Sans Mono';font-size:9px;letter-spacing:1px;line-height:1}
  .fac .badge.rec{color:var(--shrine)}
  .fac .badge.hard{color:var(--amber);border:1px solid rgba(255,176,37,.45);background:rgba(255,176,37,.06);padding:3px 6px}
  .fac .fn{font-weight:700;font-size:14px}
  .fac.on .fn{color:var(--neon)}
  .fac .fd{font-size:11px;color:var(--muted);margin-top:4px}

  .profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .profileGrid .full{grid-column:1/-1}
  @media(max-width:520px){.profileGrid{grid-template-columns:1fr}}
  .miniNote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
  .wbox{border:1px solid var(--line);background:#0b100e;margin-top:10px;padding:14px}
  .wbox .wbig{font-family:'Black Han Sans';font-size:26px;color:var(--amber);text-shadow:0 0 14px rgba(255,176,37,.28)}
  .wbox .wdesc{font-size:13px;color:var(--ink);margin-top:4px}
  .wbox .wsub{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
  textarea.certEdit{width:100%;min-height:230px;white-space:pre-wrap;word-break:break-word;font-family:'Noto Sans Mono';
    font-size:13px;background:#0b100e;border:1px dashed var(--copper);padding:16px;
    color:var(--ink);margin:0;line-height:1.7;resize:vertical;outline:none}
  textarea.certEdit:focus{border-color:var(--neon);box-shadow:0 0 0 1px rgba(22,239,198,.5)}
  .idTools{border:1px solid var(--line);background:var(--panel2);padding:14px;margin-top:14px}
  .fileline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
  input[type=file]{width:100%;max-width:340px;color:var(--muted);font-size:12px}
  .preview{margin-top:12px;border:1px solid var(--line);background:#0b100e;min-height:90px;display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden;position:relative}
  .preview img{width:100%;display:block}
  .preview.issuing{min-height:260px;border-color:var(--neon);box-shadow:0 0 28px rgba(22,239,198,.18)}
  .issueFx{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(80% 120% at 50% 30%,rgba(22,239,198,.12),rgba(8,11,10,.96));font-family:'Noto Sans Mono';letter-spacing:2px;color:var(--neon);text-align:center;z-index:2}
  .issueFx::before{content:"";position:absolute;inset:-40%;background:linear-gradient(180deg,transparent 0%,rgba(22,239,198,.12) 48%,rgba(22,239,198,.55) 50%,rgba(22,239,198,.12) 52%,transparent 100%);animation:scanIssue 1.55s linear infinite}
  .issueFx::after{content:"九龍\A직印";position:absolute;right:54px;bottom:44px;width:150px;height:150px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre;line-height:.82;border:5px solid rgba(255,43,70,.82);color:rgba(255,43,70,.9);padding:0;font-family:'Black Han Sans';font-size:60px;letter-spacing:0;transform:rotate(-9deg) scale(.7);opacity:0;animation:stampIssue .62s ease-out .9s forwards;z-index:6;text-shadow:0 0 9px rgba(255,43,70,.26)}
  .issueFx .txt{position:relative;z-index:1;font-weight:700;text-shadow:0 0 16px rgba(22,239,198,.55)}
  .issueFx .subtxt{display:block;margin-top:8px;font-size:10px;color:var(--muted);letter-spacing:1px}
  @keyframes scanIssue{from{transform:translateY(-35%)}to{transform:translateY(35%)}}
  @keyframes stampIssue{0%{opacity:0;transform:rotate(-9deg) scale(1.28)}55%{opacity:1;transform:rotate(-9deg) scale(.58)}100%{opacity:.98;transform:rotate(-9deg) scale(.7)}}

  /* 등록증 */
  #cardSec{border-color:var(--neon);
